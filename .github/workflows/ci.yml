name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Integricode.slnx
      - name: Test
        run: dotnet test Integricode.slnx --no-build
      - name: Test the workflow steps
        run: |
          dotnet pack src/Integricode -c Debug --no-build -o "$RUNNER_TEMP/feed"
          INTEGRICODE_FEED="$RUNNER_TEMP/feed" bash tests/workflows/workflow-steps.test.sh
